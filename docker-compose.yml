version: '3.8'

services:
  # AurIx Backend Service
  aurix-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurix-backend
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
      - ./temp_files:/app/temp_files
      - ./Rule-Engine:/app/Rule-Engine:ro
      - ./scanner:/app/scanner:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # AI Configuration (choose one)
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
    networks:
      - aurix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  aurix-network:
    driver: bridge
